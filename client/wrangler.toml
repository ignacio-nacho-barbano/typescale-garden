name = "typescale-garden"
compatibility_date = "2024-03-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "typescale-garden"
database_id = "4437243e-3261-4e82-95e1-f8a6cdf014d2"

# Environment Variables
[env.development]
vars = { PUB_API_URL = "", PUB_CLIENT_ORIGIN = "http://localhost:5173", PUB_AUTH_DOMAIN = "https://your-auth0-domain.auth0.com/", PUB_APP_ENV = "dev" }

[env.production]
vars = { PUB_API_URL = "https://your-domain.com", PUB_CLIENT_ORIGIN = "https://your-domain.com", PUB_AUTH_DOMAIN = "https://your-auth0-domain.auth0.com/", PUB_APP_ENV = "production" }


