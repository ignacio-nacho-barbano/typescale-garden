# Browser tests for the client.
#
# One suite, three triggers, differing only in `E2E_TARGET` (see e2e/support/target.ts):
#
#   hermetic     pull_request, push to main   a dev server this job starts, everything faked
#   live-deploy  deployment_status            the production build that just shipped
#   live-hourly  schedule                     production, once an hour
#
# Deliberately its own workflow rather than a step in a wider "CI" one: it is the only check
# that boots a browser, it is the slowest, and `client#check` and `client#lint` are both
# known-failing on main (see CLAUDE.md), so folding them in would make this signal
# permanently red and therefore ignored.
name: e2e

on:
  pull_request:
  # Also on main, so a scale-changing merge is caught even if the PR predated it.
  push:
    branches: [main]
  # Cloudflare Pages posts one of these when a deployment finishes. Filtered below to
  # production successes, so the live run tests the build that just shipped rather than the
  # previous one. NOTE: GitHub only runs `deployment_status` workflows from the **default
  # branch's** copy of this file, so this trigger does nothing until it is merged to main.
  deployment_status:
  schedule:
    # Hourly, at :17 — off the hour, and clear of the Worker's own 04:17 UTC catalogue cron
    # so a run never straddles the KV rewrite it would otherwise race.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "E2E_TARGET — local, prod, or a full URL"
        default: prod
        required: false

# A new push supersedes the run in flight for the same ref; nobody needs the old answer.
# Scheduled and deployment runs are grouped by trigger instead, so an hourly tick cannot
# cancel a merge's verification.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── the PR gate: everything faked, asserted against the committed golden fixtures ───────
  hermetic:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The repo's pinned version, above the engines of vite 8, eslint 10 and wrangler.
          node-version-file: .node-version
          cache: npm

      # `npm ci`, never `npm install`: the committed lockfile is the only thing that makes
      # this tree installable at all. Two of the client's devDependencies declare peers the
      # repo has outgrown, and a fresh resolve hits ERESOLVE — installing *from* the
      # lockfile is conflict-free. See CLAUDE.md.
      - name: Install
        run: npm ci

      # vite-imagetools transforms the image `+page.svelte` imports, which needs sharp's
      # native binary — and sharp is not in the root `allowScripts`, so npm ≥ 11 skips the
      # install script that fetches it. Without this the dev server cannot compile the page
      # and every spec fails on a blank screen. Explicit rather than relying on whichever
      # npm ships with the pinned node. Only the hermetic job builds the client at all.
      - name: Build sharp's native binary
        run: npm rebuild sharp

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Only chromium: the suite pins one engine on purpose. It asserts exact generated bytes
      # and computed pixel values, and the point is the app's own wiring, not cross-browser
      # rendering — three engines would triple the runtime to re-assert the same strings.
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System libraries live outside the cached browser directory, so they are needed even
      # on a cache hit.
      - name: Install Chromium's system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Through turbo, so `core#build` runs first — Playwright boots the client's dev server
      # itself and nothing else would produce `core/dist`.
      #
      # No `.env` is written: `e2e/support/env.ts` passes every `PUB_*` the client imports
      # through `webServer.env`, which vite's `loadEnv` applies over any `.env` file. The
      # suite is meant to be independent of local secrets, and this is where that pays off.
      - name: Run the browser tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hermetic
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ── can a runner reach production at all? ───────────────────────────────────────────────
  #
  # Both `typescalegarden.uy` and `api.typescalegarden.uy` sit behind Cloudflare, whose bot
  # mitigation challenges requests from datacenter IP ranges — which is precisely what a
  # GitHub-hosted runner has. The challenge is answered at Cloudflare's edge, so it says
  # nothing about the deployment, and it blocks every client the suite could possibly use:
  # node's fetch, Playwright's request context, an in-page `fetch` (the challenge carries no
  # CORS headers, so it surfaces as `TypeError: Failed to fetch`) and even a real Chromium
  # navigation, which lands on a Turnstile page a headless browser does not clear.
  # e2e/support/challenge.ts records the measurements.
  #
  # So this is probed rather than discovered: without it the hourly cron reports a 403 as
  # though production had regressed, which is what it did for every run between the live job
  # landing and this. A challenged run now ends as a skip with a stated reason — the same way
  # the suite already treats missing credentials and a full account — instead of as a failure
  # nobody can act on from inside this repo.
  #
  # It runs first and checks nothing out, so a blocked run costs seconds rather than a full
  # `npm ci` plus a browser download. And it self-heals: the moment the Cloudflare-side rule
  # in CLAUDE.md is in place, the probe passes and `live` runs again with no change here.
  live-reachable:
    if: |
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'deployment_status'
          && github.event.deployment_status.state == 'success'
          && github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocked: ${{ steps.probe.outputs.blocked }}

    steps:
      - name: Probe the API for a Cloudflare challenge
        id: probe
        env:
          # The API every live target resolves to today — `E2E_API_URL` aside, this is the
          # default `e2e/support/target.ts` applies to `prod` and to a bare URL target alike,
          # and the same constant deploy-server.yml's smoke test carries.
          API: https://api.typescalegarden.uy
        run: |
          # Headers only: the catalogue is ~1.9 MB and the verdict is one header. `|| true`
          # keeps a connection failure from aborting the step under `bash -e` — that is not a
          # challenge, and it should fall through to the suite, which reports it properly.
          headers=$(curl -sS -o /dev/null -D - --max-time 30 "$API/api/fonts" || true)

          # `cf-mitigated` is set on every response Cloudflare mitigates and on nothing this
          # repo serves, so its mere presence is the signal.
          mitigated=$(printf '%s' "$headers" | grep -i '^cf-mitigated:' || true)

          if [ -z "$mitigated" ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "No challenge — this runner can reach $API, so the live suite will run."
            exit 0
          fi

          echo "blocked=true" >> "$GITHUB_OUTPUT"
          echo "::warning title=Live e2e skipped::Cloudflare is challenging this runner, so the live suite cannot reach production. Not a deployment failure — see the job log and CLAUDE.md."
          cat <<'EOF'
          Cloudflare is challenging this runner, so the live suite was skipped.

          What this is NOT: a broken deployment. The challenge is answered at Cloudflare's
          edge and the Worker never sees the request, so production is serving real visitors
          normally. `server/src/` contains no 403 at all.

          What it IS: bot mitigation reacting to a GitHub-hosted runner's datacenter IP. It
          blocks every client the suite could use, so there is no workaround inside this repo
          short of faking the API — which would defeat the entire point of a live run.

          To turn this back on, exempt CI at the Cloudflare edge. CLAUDE.md, under "Why the
          live e2e run cannot reach production from CI", records the options.
          EOF
          printf 'observed: %s\n' "$mitigated"

  # ── the live runs: a deployed build, the real API, a real Auth0 user ────────────────────
  #
  # Same suite. What it cannot assert live — a controlled tenant, a forced API failure, the
  # synthetic font shapes — is skipped with a stated reason, so the run reports its own
  # coverage gap. What it uniquely proves is that the deployed build, CORS, auth and the
  # catalogue endpoint all still agree with `core`.
  #
  # The event filter lives on `live-reachable` above; a skipped dependency skips this too, so
  # the only condition needed here is the probe's verdict.
  live:
    needs: live-reachable
    if: needs.live-reachable.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # `core/dist` is what the runtime oracle imports to derive its expectations — the live
      # job never builds the client, but it does need core. No `npm rebuild sharp` here for
      # the same reason: nothing compiles `+page.svelte` in this job.
      - name: Build core
        run: npm run build --workspace core

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `deployment_status` carries the URL of the deployment that just succeeded, so the run
      # follows the deploy rather than guessing when it finished. Everything else targets
      # production by name.
      - name: Run the browser tests against the live environment
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true
          E2E_TARGET: >-
            ${{ github.event_name == 'deployment_status'
                && github.event.deployment_status.environment_url
                || (github.event.inputs.target || 'prod') }}
          # Without these the signed-in and write specs skip, with a reason, and the rest of
          # the suite still runs anonymously — which is a useful signal on its own.
          E2E_AUTH0_USERNAME: ${{ secrets.E2E_AUTH0_USERNAME }}
          E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}
          # Every scale the suite creates is prefixed `e2e-`, deleted in teardown, and swept
          # before the next run. Set this to 0 to make the live run strictly read-only.
          E2E_LIVE_WRITES: ${{ vars.E2E_LIVE_WRITES || '1' }}

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live-${{ github.run_attempt }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
